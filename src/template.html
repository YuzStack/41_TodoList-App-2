<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlowTask | Reduce Cognitive Load</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body class="bg-white text-gray-900">
    <!-- Header & Projects Drawer Starts... -->
    <header class="flex items-center justify-between px-3 py-2">
      <h1 class="text-xl font-bold text-blue-600">TaskFlow</h1>
      <i class="create-todo-btn fa-solid fa-plus text-xl"></i>
      <i class="proj-draw-btn fa-solid fa-bars text-xl"></i>
      <div
        class="projects-container fixed top-0 left-0 z-10 h-screen w-[175px] -translate-x-full items-baseline bg-gray-900 px-3 py-2 font-bold text-white duration-300 ease-in-out"
      >
        <div class="flex items-center justify-between">
          <h1 class="mb-3 ml-0 text-lg">PROJECTS</h1>
        </div>
        <div class="projects flex flex-col items-baseline gap-2 pl-5">
          <!-- <button>Family</button>
          <button>Default</button>
          <button>Work</button> -->

          <!-- <div class="mt-2 flex items-center gap-2">
            <div
              class="add-proj-btn flex h-7 w-7 cursor-pointer items-center justify-center rounded-full bg-gray-500 opacity-90 duration-200 ease-in-out"
            >
              <button
                class="flex h-5 w-5 cursor-pointer items-center justify-center rounded-full border-0 bg-transparent p-0 text-3xl leading-none font-extralight"
              >
                <span class="-translate-y-[7.5%] cursor-pointer">+</span>
              </button>
            </div>
            <form
              class="add-project-form flex max-w-[120px] -translate-y-3 gap-0 rounded-sm bg-white opacity-0 duration-200 ease-in-out"
            >
              <input
                type="text"
                placeholder="Project name..."
                class="project-name-input max-w-[100px] bg-transparent px-2 py-1 text-sm text-gray-900 focus:outline-none"
              />
              <button class="w-5 rounded-r-sm bg-blue-600 text-white">➜</button>
            </form>
          </div> -->
        </div>
      </div>
    </header>
    <!-- Header & Projects Drawer Ends. -->

    <!-- MAIN STARTS...-->
    <main class="main relative min-h-screen max-w-full px-3 py-2">
      <!-- Todos View Starts... -->
      <div class="todos absolute top-10 left-0 flex w-full flex-col gap-4 pl-3">
        <!-- <div class="todo flex flex-col gap-2">
          <div class="flex items-center gap-3 leading-5">
            <div class="border-l-4 border-green-500 pl-2.5">
              <p class="todo-title">Read book</p>
              <div class="flex items-center justify-between gap-3">
                <p class="dueDate font-serif text-sm text-gray-600">Feb 17th</p>
                <div class="priority">⏳⏳</div>
              </div>
            </div>
          </div>
          <hr class="text-gray-300" />
        </div> -->
      </div>
      <!-- Todo View Ends. -->

      <!-- Create/Add Todo Dialog Starts... -->
      <dialog
        open
        class="dialog absolute top-[5%] left-0 -z-10 m-auto min-h-[500px] min-w-[300px] translate-y-5 rounded-md bg-blue-900 p-3 text-white opacity-0 duration-300 ease-in-out focus:outline-0"
      >
        <h1 class="mb-5 text-center text-2xl">Add Todo</h1>
        <form method="dialog" class="dialog-form flex flex-col gap-5">
          <div class="flex flex-col gap-1">
            <label for="todo-title">Todo title (required):</label>
            <input
              type="text"
              id="todo-title"
              required
              class="h-7 rounded-sm bg-white p-2 text-gray-900 focus:outline-0"
              placeholder="Title..."
            />
          </div>

          <div class="flex flex-col gap-1">
            <label for="todo-description">Todo description:</label>
            <textarea
              id="todo-description"
              rows="3"
              class="rounded-lg bg-white p-2 text-gray-900 focus:outline-0"
              placeholder="Description..."
            ></textarea>
          </div>

          <div class="flex flex-col gap-1">
            <label for="due-date">Due date:</label>
            <input
              type="datetime-local"
              id="due-date"
              class="h-7 rounded-sm bg-white p-2 text-gray-900 focus:outline-0"
              placeholder="Write something..."
            />
          </div>

          <div class="flex flex-col gap-1">
            <label for="priority-level">Priority level:</label>
            <select id="priority-level" class="focus:outline-0">
              <option value="Low">Low</option>
              <option value="Medium">Medium</option>
              <option value="High">High</option>
            </select>
          </div>

          <div class="flex items-center gap-3">
            <label for="cheklist">Cheklist:</label>
            <input
              type="checkbox"
              id="cheklist"
              class="h-5 w-5 rounded-sm"
              placeholder="Write something..."
            />
          </div>

          <button class="rounded-md bg-blue-600 px-2 py-1">Add</button>
        </form>
      </dialog>
      <div class="dialog-overlay absolute inset-0 z-5 hidden bg-black/30"></div>
      <!-- Create/Add Todo Dialog Ends. -->

      <!-- Full Todo View Starts... -->
      <div
        class="full-todo-view-container fixed inset-0 -z-20 flex items-center justify-center bg-black/20 p-4 opacity-0 duration-100 ease-in-out"
      >
        <div
          class="full-todo-view-sub-container w-full max-w-lg rounded-xl bg-white shadow-2xl"
        >
          <!-- Header (Edit & Delete Buttons) -->
          <div
            class="flex items-start justify-between border-b border-gray-100 p-5"
          >
            <button
              class="edit-todo-btn text-lg font-semibold text-blue-600 hover:text-blue-700"
            >
              Save
            </button>

            <button class="delete-todo-btn text-2xl" title="Delete Task">
              🗑️
            </button>
          </div>

          <!-- Todo Details -->
          <div class="space-y-6 p-6">
            <div>
              <input
                type="text"
                value="Project Kickoff"
                class="todo-title w-full border-b-2 border-transparent pb-1 text-3xl font-extrabold focus:border-blue-600 focus:outline-none"
              />
            </div>

            <div class="flex items-center justify-between text-sm">
              <span
                class="priority-lvl-indicator rounded-full px-3 py-1 text-xs font-semibold"
              >
                HIGH PRIORITY
              </span>

              <div class="flex items-center gap-2 text-gray-500">
                <label for="due-date-input" class="font-medium">Due:</label>
                <input
                  type="date"
                  id="due-date-input"
                  value="2025-12-15"
                  class="due-date rounded border p-1 text-gray-700 focus:outline-blue-600"
                />
              </div>
            </div>

            <div>
              <h3 class="mb-2 text-lg font-semibold text-gray-700">Details</h3>
              <!-- prettier-ignore -->
              <textarea
                placeholder="Add detailed description..."
                class="todo-description min-h-[120px] w-full resize-none rounded-lg border p-3 text-gray-700 focus:outline-blue-600"
              >Outline features and draw flowchart for the entire app structure (MVC).</textarea>
            </div>
          </div>

          <!-- Mark Complete Button -->
          <div class="border-t border-gray-100 p-4">
            <button
              class="toggle-completion-btn w-full cursor-pointer rounded-lg px-2 py-3 font-bold text-white shadow-md"
              title="Toggle Completion Status"
            >
              ☐ Mark Complete
            </button>
          </div>
        </div>
      </div>
      <!-- Full Todo View Ends. -->
    </main>
    <!-- MAIN ENDS...-->
  </body>
</html>
